<div class="pyramid-page">
  <a class="mode-link" routerLink="/">← Ana Menü</a>

  <h2 class="title">🔺 Piramit</h2>

  <div class="loading" *ngIf="loading">Yükleniyor…</div>
  <div class="loading" *ngIf="!loading && !pyramid">Piramit verisi bulunamadı.</div>

  <ng-container *ngIf="pyramid">
    <!-- Piramit gövdesi: tepe (kısa) üstte, taban (uzun) altta -->
    <div class="pyramid" [style.--cols]="baseCols">
      <ng-container *ngFor="let level of displayRows; let d = index">
        <!-- Bu satırdan bir üst satıra çıkarken düşen harf -->
        <div
          class="drop-link"
          *ngIf="droppedLetter(realIndex(d)) as dropped"
          [@dropIn]
          [attr.aria-label]="dropped + ' harfi çıktı'">
          <span class="drop-chip">
            <span class="drop-letter">{{ dropped }}</span>
            <span class="drop-x" aria-hidden="true">✕</span>
          </span>
        </div>

        <div
          class="row"
          [ngClass]="rowState(realIndex(d))"
          [@rowPulse]="rowState(realIndex(d))">
          <div class="tile" *ngFor="let ch of tilesFor(realIndex(d))" [@tileIn]>
            {{ ch }}
          </div>
        </div>
      </ng-container>
    </div>

    <p class="drop-legend" *ngIf="!won && currentLevel > 0">
      <span class="legend-dot" aria-hidden="true"></span>
      Çarpılı harf, bir üst kelimeye taşınmayan harftir.
    </p>

    <!-- İpucu ve giriş -->
    <div class="panel" *ngIf="!won" [@shake]="shakeState">
      <div class="clue-label">{{ current?.letters?.length }} harf</div>
      <p class="clue">{{ current?.clue }}</p>
      <form (submit)="submit(); $event.preventDefault()">
        <input
          [(ngModel)]="userInput"
          [ngModelOptions]="{ standalone: true }"
          class="answer-input"
          autocomplete="off"
          placeholder="Cevabın…"
          #ans
          autofocus />
        <div class="buttons">
          <button type="submit" class="btn primary">Onayla</button>
          <button type="button" class="btn ghost" (click)="reveal()">Gör / Geç</button>
        </div>
      </form>
    </div>

    <!-- Kazanma ekranı -->
    <div class="panel win" *ngIf="won">
      <h3>🎉 Piramit tamamlandı!</h3>
      <p>{{ solvedCount }} / {{ levels.length }} kelimeyi bildin.</p>
      <button class="btn primary" (click)="newPyramid()">Yeni Piramit</button>
    </div>
  </ng-container>

  <div class="designer">
    <a class="gh-badge" href="https://github.com/fthgcr" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
      <span class="gh-name">Fatih GÖCER</span>
    </a>
  </div>
</div>
